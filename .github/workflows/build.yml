name: Build Maze Sphere
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q MazeSphere-Upload.zip
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build APK
        working-directory: MazeSphere
        run: |
          npm install
          cp node_modules/three/build/three.module.js www/three.module.js
          cp node_modules/three/build/three.core.js www/three.core.js
          sed -i "s#https://cdn.jsdelivr.net/npm/three@[0-9.]*/build/three.module.js#./three.module.js#g" www/index.html
          npx cap add android
          npx cap sync android
          sed -i 's#<activity#<activity android:screenOrientation="portrait"#' android/app/src/main/AndroidManifest.xml
          cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MazeSphere-APK
          path: MazeSphere/android/app/build/outputs/apk/debug/app-debug.apk
