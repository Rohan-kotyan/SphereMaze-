name: Build Maze Sphere
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          Z=$(find . -iname '*.zip' -not -path './.git/*' | head -1)
          echo "Using zip: $Z"
          test -n "$Z" || { echo "No zip found"; exit 1; }
          unzip -q "$Z" -d proj
          P=$(dirname "$(find proj -name package.json -not -path '*/node_modules/*' | head -1)")
          echo "Project folder: $P"
          echo "PROJ=$P" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build APK
        working-directory: ${{ env.PROJ }}
        run: |
          npm install
          cp node_modules/three/build/three.module.js www/three.module.js
          cp node_modules/three/build/three.core.js www/three.core.js
          mkdir -p www/lib && cp node_modules/three/build/three.module.js node_modules/three/build/three.core.js www/lib/   # bundled copy used by index.html (works offline)
          sed -i "s#https://cdn.jsdelivr.net/npm/three@[0-9.]*/build/three.module.js#./three.module.js#g" www/index.html
          cp node_modules/peerjs/dist/peerjs.min.js www/lib/peerjs.min.js   # bundled copy for online rooms
          mkdir -p www/fonts && cp node_modules/@fontsource/lilita-one/files/lilita-one-latin-400-normal.woff2 www/fonts/lilita-one.woff2
          npx cap add android
          npx cap sync android
          # Firebase Analytics: if google-services.json (from your Firebase project) is in the project root, it is added to the app
          if [ -f google-services.json ]; then cp google-services.json android/app/google-services.json; echo 'Firebase config added'; else echo 'No google-services.json: analytics stays off'; fi
          sed -i 's#<activity#<activity android:screenOrientation="portrait"#' android/app/src/main/AndroidManifest.xml
          # full screen (immersive): hide the status bar + navigation bar, swipe from an edge to show them briefly; draw under the camera notch
          cat > android/app/src/main/java/com/stellix/spheremaze/MainActivity.java <<'JAVA'
          package com.stellix.spheremaze;

          import android.os.Build;
          import android.os.Bundle;
          import android.view.Window;
          import android.view.WindowManager;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              Window w = getWindow();
              if (Build.VERSION.SDK_INT >= 28) {
                w.getAttributes().layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
              }
              goImmersive();
            }

            @Override
            public void onWindowFocusChanged(boolean hasFocus) {
              super.onWindowFocusChanged(hasFocus);
              if (hasFocus) goImmersive();
            }

            private void goImmersive() {
              Window w = getWindow();
              WindowCompat.setDecorFitsSystemWindows(w, false);
              WindowInsetsControllerCompat c = WindowCompat.getInsetsController(w, w.getDecorView());
              if (c != null) {
                c.setSystemBarsBehavior(WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);
                c.hide(WindowInsetsCompat.Type.systemBars());
              }
            }
          }
          JAVA
          # streak reminders: Android 13+ notification permission
          sed -i 's#<application#<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/><application#' android/app/src/main/AndroidManifest.xml
          # hardening: no cloud/adb backups of the save file, no remote WebView debugging
          sed -i 's#<application#<application android:allowBackup="false" android:fullBackupContent="false"#; s#android:allowBackup="true"##' android/app/src/main/AndroidManifest.xml
          sed -i 's#</application>#<meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-2177990650461829~5331481554"/></application>#' android/app/src/main/AndroidManifest.xml
          if [ -d icons ]; then
            R=android/app/src/main/res
            for d in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do mkdir -p $R/$d; cp icons/$d/*.png $R/$d/; done
            mkdir -p $R/values && cp icons/values/ic_launcher_background.xml $R/values/
            for d in drawable-mdpi drawable-hdpi drawable-xhdpi drawable-xxhdpi drawable-xxxhdpi; do mkdir -p $R/$d; cp icons/$d/ic_stat_icon_config_sample.png $R/$d/; done
            find $R -name 'splash.png' -exec cp icons/splash.png {} \;
          fi
          # app version shown on Google Play: versionName 0.1 (versionCode must go up by 1 with every upload)
          sed -i 's/versionCode [0-9]*/versionCode 1/; s/versionName "[^"]*"/versionName "0.1"/' android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle
          cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MazeSphere-APK
          path: ${{ env.PROJ }}/android/app/build/outputs/apk/debug/app-debug.apk
