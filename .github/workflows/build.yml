name: Build Maze Sphere
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          Z=$(find . -iname '*.zip' -not -path './.git/*' | head -1)
          echo "Using zip: $Z"
          test -n "$Z" || { echo "No zip found"; exit 1; }
          unzip -q "$Z" -d proj
          P=$(dirname "$(find proj -name package.json -not -path '*/node_modules/*' | head -1)")
          echo "Project folder: $P"
          echo "PROJ=$P" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build APK
        working-directory: ${{ env.PROJ }}
        run: |
          npm install
          cp node_modules/three/build/three.module.js www/three.module.js
          cp node_modules/three/build/three.core.js www/three.core.js
          sed -i "s#https://cdn.jsdelivr.net/npm/three@[0-9.]*/build/three.module.js#./three.module.js#g" www/index.html
          npx cap add android
          npx cap sync android
          sed -i 's#<activity#<activity android:screenOrientation="portrait"#' android/app/src/main/AndroidManifest.xml
          cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MazeSphere-APK
          path: ${{ env.PROJ }}/android/app/build/outputs/apk/debug/app-debug.apk
